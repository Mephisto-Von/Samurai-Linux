# Samurai Linux logging defaults.
#
# Storage=persistent keeps the journal across reboots so that the firewall's
# dropped-packet records, sudo failures and service errors survive long enough
# to be read after a restart. On the live medium /var is not writable and
# journald falls back to volatile storage with a warning, which is the intended
# behaviour there; the installed system gets the real journal.
[Journal]
Storage=persistent
