#!/usr/sbin/nft -f
# Samurai Linux default packet filter.
#
# Policy: deny unsolicited inbound, allow everything outbound, allow what the
# conntracker already knows belongs to a connection we started. A developer
# workstation listens on nothing by default, so this closes the window that
# opens the moment a user starts a server, and it is deliberately narrow enough
# that ssh, a local registry or a game server can be permitted one line at a
# time from /etc/nftables.d/.
#
# inet family on purpose: an IPv4-only filter leaves the host wide open on
# IPv6, and a workstation on a modern network has a global IPv6 address.
#
# The exception chain is jumped to rather than hung on a second hook: a drop
# verdict ends packet traversal, so a lower-priority accept chain would never
# be consulted.
#
# Add exceptions to /etc/nftables.d/*.nft instead of editing this file, so a
# package upgrade never overwrites them:
#   add rule inet samurai ingress_exceptions tcp dport 22 accept

flush ruleset

table inet samurai {
	chain ingress {
		type filter hook input priority 0; policy drop;

		ct state established,related accept
		ct state invalid drop
		iif lo accept

		# A DHCPv4 client cannot renew without the server's unicast reply,
		# and IPv6 address configuration is impossible without these ICMPv6
		# and DHCPv6 exchanges; blocking them isolates the machine.
		meta nfproto ipv4 udp sport 67 udp dport 68 accept
		meta nfproto ipv6 udp sport 547 udp dport 546 accept
		meta nfproto ipv6 icmpv6 type { nd-router-solicit, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert, mld-listener-query } accept

		# IPv4 ping is kept reachable but rate limited, so it cannot be used to
		# amplify traffic or to flood the logs below. ICMPv6 echo is not
		# accepted; only the neighbour/router types above are.
		meta nfproto ipv4 icmp type echo-request limit rate 10/second accept

		jump ingress_exceptions

		# Whatever is left is unsolicited inbound traffic. Record it at a
		# rate the journal can survive, then let the policy drop it.
		limit rate 10/minute log flags all prefix "samurai-drop: "
	}

	# Empty by design; /etc/nftables.d drop-ins add the operator's exceptions.
	chain ingress_exceptions {
	}

	chain forward {
		type filter hook forward priority 0; policy drop;
		ct state established,related accept
	}

	chain egress {
		type filter hook output priority 0; policy accept;
		ct state invalid drop
	}
}

include "/etc/nftables.d/*.nft"
