name: Build ISO (hosted)

# Build a real ISO on a standard GitHub-hosted runner. live-build needs root,
# mounts, and chroot, so it runs inside a privileged Debian trixie container.
# The self-hosted workflow remains available for signed release builds.
on:
  workflow_dispatch:
    inputs:
      min_disk_gb:
        description: "Free disk required inside the builder (GiB)"
        type: string
        default: "25"

permissions:
  contents: read
  actions: read

jobs:
  iso:
    name: Build live ISO (hosted)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      # Kept out of the build container on purpose: build.sh signs when this is
      # set, and the container has no keyring. Signing happens below, on the
      # runner, after the image is built.
      SAMURAI_SIGN_KEY: ${{ secrets.SAMURAI_SIGN_KEY }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/lib/jvm \
            /usr/local/lib/node_modules
          sudo apt-get clean
          df -h /

      - uses: actions/checkout@v5

      - name: Build ISO in Debian trixie
        env:
          SAMURAI_MIN_DISK_GB: ${{ inputs.min_disk_gb }}
        run: |
          docker run --privileged --rm \
            -e SAMURAI_MIN_DISK_GB \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            debian:trixie bash -lc '
              set -euo pipefail
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                ca-certificates live-build debootstrap xorriso squashfs-tools gnupg
              bash build/build.sh --check
              bash build/build.sh
              chown -R "$(stat -c %u:%g /work)" /work
            '

      - name: Show artifacts
        run: ls -lh dist

      - name: Install ISO test tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            qemu-system-x86 xorriso squashfs-tools python3-pil

      - name: Verify ISO contents
        run: |
          iso=$(find dist -maxdepth 1 -name '*.iso' -print -quit)
          test -n "$iso"
          bash build/verify-iso.sh "$iso"

      - name: Extract boot configuration
        run: |
          iso=$(find dist -maxdepth 1 -name '*.iso' -print -quit)
          test -n "$iso"
          mkdir -p build/boot-config
          for path in isolinux boot/grub; do
            xorriso -osirrox on -indev "$iso" \
              -extract "/$path" "build/boot-config/$path" >/dev/null || true
          done
          find build/boot-config -maxdepth 2 -type f -print

      - name: Boot-test ISO in QEMU
        env:
          QEMU_TIMEOUT: "300"
        run: |
          iso=$(find dist -maxdepth 1 -name '*.iso' -print -quit)
          test -n "$iso"
          bash build/qemu-test.sh "$iso"

      - name: Convert QEMU screenshot
        if: always()
        run: |
          if [ -f build/qemu-screen.ppm ]; then
            python3 -c 'from PIL import Image; Image.open("build/qemu-screen.ppm").save("build/qemu-screen.png")'
          fi

      - name: Upload QEMU diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-diagnostics
          path: |
            build/qemu-serial.log
            build/qemu-screen.ppm
            build/qemu-screen.png
            build/boot-config
          if-no-files-found: warn
          retention-days: 7

      - name: Sign the ISO
        if: ${{ env.SAMURAI_SIGN_KEY != '' }}
        env:
          SAMURAI_SIGN_KEY_ARMORED: ${{ secrets.SAMURAI_SIGN_KEY_ARMORED }}
          SAMURAI_SIGN_PASSPHRASE: ${{ secrets.SAMURAI_SIGN_PASSPHRASE }}
        run: |
          set -euo pipefail
          export GNUPGHOME
          GNUPGHOME=$(mktemp -d)
          chmod 700 "$GNUPGHOME"
          printf '%s\n' "$SAMURAI_SIGN_KEY_ARMORED" | gpg --batch --import
          iso=$(find dist -maxdepth 1 -name '*.iso' -print -quit)
          test -n "$iso"
          # Sign the ISO, its checksum and the package manifest. A checksum file
          # that is not itself signed protects nothing: whoever can replace the
          # ISO can rewrite the hash beside it.
          sign() {
            printf '%s\n' "$SAMURAI_SIGN_PASSPHRASE" | gpg --batch --pinentry-mode loopback \
              --passphrase-fd 0 --armor --detach-sign --local-user "$SAMURAI_SIGN_KEY" \
              --output "$1.sig" "$1"
            gpg --verify "$1.sig" "$1"
          }
          sign "$iso"
          if [[ ! -f "$iso.sha256" ]]; then
            echo "The build produced no checksum beside $iso; an ISO without a signed checksum cannot be published" >&2
            exit 1
          fi
          sign "$iso.sha256"
          for manifest in dist/*.packages.tsv; do
            if [[ -e "$manifest" ]]; then
              sign "$manifest"
            fi
          done
          # Publish the public half so users can verify without the repo.
          gpg --armor --export "$SAMURAI_SIGN_KEY" > dist/samurai-release-key.asc
          gpg --with-colons --fingerprints --list-keys "$SAMURAI_SIGN_KEY" \
            | awk -F: '$1 == "fpr" { print $10; exit }' | tee dist/samurai-release-key.fpr
          # The exported key is only a trust anchor if it is the key the
          # repository documents. A rotated CI secret would otherwise sign a
          # release nobody outside this runner could verify.
          if [[ ! -s samurai/keys/samurai-release.fpr ]]; then
            echo "samurai/keys/samurai-release.fpr is missing; the signing key has no published fingerprint" >&2
            exit 1
          fi
          if ! cmp -s dist/samurai-release-key.fpr samurai/keys/samurai-release.fpr; then
            echo "The CI signing key is not the key published under samurai/keys/" >&2
            echo "  CI:  $(cat dist/samurai-release-key.fpr)" >&2
            echo "  repo: $(cat samurai/keys/samurai-release.fpr)" >&2
            exit 1
          fi
          sha256sum dist/samurai-release-key.asc
          ls -lh dist

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: samurai-linux-iso
          path: |
            dist/*.iso
            dist/*.sha256
            dist/*.sig
            dist/*.asc
            dist/*.fpr
            dist/*.packages.tsv
          if-no-files-found: error
          retention-days: 7

  install-test:
    name: Install ISO in QEMU
    needs: iso
    uses: ./.github/workflows/install-test.yml
    with:
      run_id: ${{ github.run_id }}
      branded: true
    permissions:
      contents: read
      actions: read
