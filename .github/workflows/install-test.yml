name: Install test

# Drive the real Calamares UI in QEMU, install to a blank disk, boot the
# installed system, and verify it over the serial console.
#
# The workflow can be called by the ISO build (same-run artifact) or dispatched
# manually with a build run ID. It is deliberately not triggered by push: a
# push would test whatever ISO artifact is newest, which is usually older than
# the commit being pushed.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build ISO (hosted) run ID (blank = latest successful build)"
        required: false
        type: string
      branded:
        description: "Require Samurai branding on the installed system"
        required: false
        type: boolean
        default: false
      desktop:
        description: "Boot the installed system into Plasma and verify the desktop"
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      run_id:
        description: "Run that holds the samurai-linux-iso artifact"
        required: false
        type: string
      branded:
        description: "Require Samurai branding on the installed system"
        required: false
        type: boolean
        default: false
      desktop:
        description: "Boot the installed system into Plasma and verify the desktop"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

jobs:
  install:
    name: Install ISO to disk
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      CALL_RUN_ID: ${{ inputs.run_id }}
      DISPATCH_RUN_ID: ${{ github.event.inputs.run_id }}
      EXPECT_BRANDING: ${{ inputs.branded }}
      EXPECT_DESKTOP: ${{ inputs.desktop }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/lib/jvm \
            /usr/local/lib/node_modules
          sudo apt-get clean
          df -h /

      - uses: actions/checkout@v5

      - name: Resolve the ISO build run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="${CALL_RUN_ID:-${DISPATCH_RUN_ID:-}}"
          if [[ -z "$run_id" ]]; then
            # Do not filter on status=success. The build job succeeds even when
            # the chained install test fails, so a status filter keeps selecting
            # an ISO from before every installer fix, and once that artifact
            # expires the run has no ISO at all. Take the newest build that
            # still has an unexpired ISO artifact.
            for run in $(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/build-iso-hosted.yml/runs?per_page=15" \
              --jq '.workflow_runs[] | select(.status == "completed") | .id'); do
              found=$(gh api \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${run}/artifacts?per_page=100" \
                --jq '.artifacts[] | select(.name == "samurai-linux-iso" and .expired == false) | .id' \
                | head -n 1)
              if [[ -n "$found" ]]; then
                run_id="$run"
                break
              fi
            done
          fi
          [[ -n "$run_id" && "$run_id" != "null" ]] || {
            echo "No Build ISO (hosted) run with a live samurai-linux-iso artifact" >&2
            exit 1
          }
          echo "Using ISO artifact from run $run_id"
          echo "ISO_RUN_ID=$run_id" >> "$GITHUB_ENV"

      # Do not use actions/download-artifact with run-id here: the API responds
      # with a 301 to the repository's current name after a rename, and the
      # action treats that as a hard failure. curl follows the redirect.
      - name: Download ISO artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          artifact_id=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${ISO_RUN_ID}/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == "samurai-linux-iso") | .id' | head -n 1)
          if [[ -z "$artifact_id" ]]; then
            echo "Run $ISO_RUN_ID has no samurai-linux-iso artifact" >&2
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ISO_RUN_ID}/artifacts" \
              --jq '.artifacts[].name' >&2 || true
            exit 1
          fi
          echo "Downloading artifact $artifact_id from run $ISO_RUN_ID"
          curl -fsSL --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -o dist/samurai-linux-iso.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip"
          unzip -q -o dist/samurai-linux-iso.zip -d dist
          rm -f dist/samurai-linux-iso.zip
          find dist -maxdepth 2 -name '*.iso' -print

      - name: Install QEMU, OCR, and VNC tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils tesseract-ocr python3-pil python3-venv
          python3 -m venv /tmp/vncvenv
          /tmp/vncvenv/bin/pip install --disable-pip-version-check vncdotool==1.4.2
          echo "/tmp/vncvenv/bin" >> "$GITHUB_PATH"
          /tmp/vncvenv/bin/vncdo --help >/dev/null

      - name: Show downloaded ISO
        run: ls -lh dist

      - name: Self-test the serial harness
        run: python3 build/install-test.py --self-test

      - name: Install ISO in QEMU
        run: |
          set -euo pipefail
          iso=$(find dist -maxdepth 1 -name '*.iso' -print -quit)
          test -n "$iso"
          args=()
          if [[ "${EXPECT_BRANDING:-false}" == "true" ]]; then
            args+=(--branded)
          fi
          if [[ "${EXPECT_DESKTOP:-true}" == "false" ]]; then
            args+=(--no-desktop)
          fi
          bash build/install-test.sh "$iso" "${args[@]}" --timeout 5400

      - name: Show install test log
        if: always()
        run: |
          if [ -f build/install-test/driver.log ]; then
            {
              echo '## Install test driver log'
              echo '```'
              tail -n 250 build/install-test/driver.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload install diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-test-diagnostics
          path: |
            build/install-test/*.log
            build/install-test/*.txt
            build/install-test/*.png
          if-no-files-found: warn
          retention-days: 7
